  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

bd: \"var(--sevc-bd)\" },\n    HIGH: { fg: \"var(--sevh-fg)\", bg: \"var(--sevh-bg)\", bd: \"var(--sevh-bd)\" },\n    MEDIUM: { fg: \"var(--sevm-fg)\", bg: \"var(--sevm-bg)\", bd: \"var(--sevm-bd)\" },\n    INFORMATIONAL: { fg: \"var(--sevi-fg)\", bg: \"var(--sevi-bg)\", bd: \"var(--sevi-bd)\" }\n  };\n\n  D = {\"date\":\"2026-08-22\",\"generatedAt\":\"2026-08-22T09:16:43+08:00\",\"edition\":\"Daily News Briefing\",\"sources\":[\"BBC\",\"CNA\",\"The Straits Times\",\"Mothership\",\"Shin Min Daily News (via Mothership)\",\"Lianhe Zaobao (via Mothership)\",\"NEA (data.gov.sg)\",\"LTA (data.gov.sg)\",\"Motorist.sg\",\"WHO Disease Outbreak News\",\"ECDC (Communicable Disease Threats Report, week 34)\",\"UN (Ebola coordinator)\",\"The Hacker News\",\"BleepingComputer\",\"CISA KEV\",\"NVD\",\"Cisco Security Advisory\",\"Check Point Research\",\"Patchstack\",\"Rapid7\"],\"sections\":{\"top_stories\":{\"label\":\"Top Stories\",\"ai_summary\":\"Russian drones struck a shopping centre in Kryvyi Rih on Friday, then struck it again half an hour later, killing at least 16 people and wounding more than 130. The Iran standoff turned into a race between exits: Iran's president said it was time to end the war from a position of strength, while Washington readies sanctions on Aug 24 that the US Treasury secretary says are meant to bring the government down. Legal and regulatory pressure ran through the rest of the day, most sharply in Turkey's move to have Netanyahu listed by Interpol; nine-figure fines also landed on two of the biggest tech platforms. Watch Aug 24 - the sanctions text will show whether Tehran's exit signal survives contact with it.\",\"stories\":[{\"id\":\"ts1\",\"headline\":\"Russian 'double-tap' drone strike on Kryvyi Rih shopping centre kills at least 16\",\"category\":\"Wars & Conflicts\",\"summary\":\"Russian drones hit a shopping centre in Kryvyi Rih on Aug 21, with a second drone striking about half an hour after the first in what President Volodymyr Zelensky called a deliberate attempt to hit emergency responders. Regional governor Oleksandr Hanzha said at least 16 people were killed and more than 130 wounded, 22 of them children, with nine people preliminarily missing; earlier reports during the day put the toll at 14. Russia's defence ministry has not commented on the shopping centre; a separate drone strike in Mykolaiv killed four people, including three children, Ukrainian state media said.\",\"source\":\"The Straits Times, BBC, CNA\",\"published_at\":\"2026-08-21T23:07+08:00\",\"url\":\"https://www.straitstimes.com/world/europe/five-killed-52-wounded-in-russian-strike-on-ukraines-kryvyi-rih\"},{\"id\":\"ts2\",\"headline\":\"Iran's president says it is time to end the war as Washington readies its harshest sanctions\",\"category\":\"Geopolitics\",\"summary\":\"President Masoud Pezeshkian said Tehran should end the war 'while we are in a position of power and dignity' - the clearest exit signal yet from Iran's civilian leadership. It came as Treasury Secretary Scott Bessent promised on Aug 24 to detail sanctions he says are meant to collapse the Iranian government; Iran's armed forces chief of staff, Major-General Ali Abdollahi, said the response would be 'crushing, punishing and devastating' across land, sea, air and cyberspace, according to Iranian media. China said sanctions and pressure are not a solution and urged a political settlement.\",\"source\":\"The Straits Times, CNA\",\"published_at\":\"2026-08-21T20:53+08:00\",\"url\":\"https://www.straitstimes.com/world/middle-east/irans-president-says-time-to-end-war-while-tehran-is-in-position-of-strength\"},{\"id\":\"ts3\",\"headline\":\"NATO facilitates Strait of Hormuz talks but says it is not a NATO mission\",\"category\":\"Geopolitics\",\"summary\":\"NATO's supreme allied commander, US Air Force General Alexus Grynkewich, hosted a chiefs-of-defence videoconference on Aug 19 to help interested allies coordinate contributions to freedom of navigation in the Strait of Hormuz, his spokesperson said - stressing this is not an alliance operation. France and Britain have been building a coalition of roughly a dozen countries to guarantee safe passage once the conflict eases; the strait carried about a fifth of all traded oil before February.\",\"source\":\"The Straits Times\",\"published_at\":\"2026-08-22T00:37+08:00\",\"url\":\"https://www.straitstimes.com/world/europe/nato-members-discuss-strait-of-hormuz-options-without-alliance-involvement\"},{\"id\":\"ts4\",\"headline\":\"UK, Canada and Australia call Israel's refusal to open a criminal probe into aid worker killings 'shameful'\",\"category\":\"World Politics\",\"summary\":\"The three governments issued a joint statement over Israel's decision not to open a criminal investigation into the April 2024 strikes on a World Central Kitchen convoy in Gaza that killed seven aid workers - three Britons, a Pole, an Australian, a Canadian and a dual US-Canadian citizen. Israel's ambassador to Australia, Hillel Newman, defended the decision, saying there was 'no criminal intention' and therefore no criminal responsibility.\",\"source\":\"BBC\",\"published_at\":\"2026-08-21T23:58+08:00\",\"url\":\"https://www.bbc.co.uk/news/articles/cvgl2pe09eno\"},{\"id\":\"ts5\",\"headline\":\"Turkey to seek an Interpol notice for Netanyahu; Israeli PM calls Erdogan an 'antisemitic dictator'\",\"category\":\"World Politics\",\"summary\":\"Turkish prosecutors are moving to seek an international arrest warrant for Israeli Prime Minister Benjamin Netanyahu over Israel's interception of a Gaza aid flotilla, an accusation Ankara frames as genocide. Netanyahu responded by calling President Recep Tayyip Erdogan an 'antisemitic dictator'. Neither side's characterisation has been tested in court.\",\"source\":\"The Straits Times, CNA\",\"published_at\":\"2026-08-22T00:12+08:00\",\"url\":\"https://www.straitstimes.com/world/middle-east/turkey-to-seek-interpol-notice-for-netanyahu-in-gaza-flotilla-case\"},{\"id\":\"ts6\",\"headline\":\"Israel re-establishes an evacuated West Bank settlement as protests over expansion grow\",\"category\":\"Wars & Conflicts\",\"summary\":\"Thirty settler families moved into Kadim near Jenin, reversing an evacuation carried out by a previous Israeli government under the 2005 Disengagement Plan, with the finance and justice ministers and the Knesset speaker attending. It follows a joint demand from the UK, France, Germany, Italy and Canada that Israel drop plans for more than 1,200 homes in the E1 corridor, which the UN says would make a contiguous Palestinian state unviable. All settlements are illegal under international law; Israel disputes this.\",\"source\":\"BBC\",\"published_at\":\"2026-08-21T13:00+08:00\",\"url\":\"https://www.bbc.co.uk/news/articles/cn7n0l4p0kzo\"},{\"id\":\"ts7\",\"headline\":\"TikTok to pay US$400 million to settle US children's privacy case\",\"category\":\"Business & Tech\",\"summary\":\"The US Justice Department and TikTok settled a 2024 lawsuit alleging the app illegally collected data from users under 13 without parental consent, in breach of the Children's Online Privacy Protection Act. TikTok pays US$300 million immediately and a further US$100 million once an order vacating a 2019 FTC consent decree against predecessor Musical.ly is entered; the lawsuit is dismissed with prejudice.\",\"source\":\"CNA, The Straits Times\",\"published_at\":\"2026-08-22T03:43+08:00\",\"url\":\"https://www.channelnewsasia.com/world/tiktok-400-million-settlement-children-privacy-6334166\"},{\"id\":\"ts8\",\"headline\":\"Hong Kong's Tiananmen vigil organisers convicted under the national security law\",\"category\":\"World Politics\",\"summary\":\"Lee Cheuk-yan, 69, and Chow Hang-tung, 41, were found guilty of inciting others to subvert state power over their role organising the city's annual June 4 vigils. Both face up to 10 years in prison, with sentencing to follow; a third defendant, Albert Ho, 74, pleaded guilty in January. Hong Kong banned the vigils in 2020 citing Covid-19 rules and they have never resumed.\",\"source\":\"BBC\",\"published_at\":\"2026-08-21T13:47+08:00\",\"url\":\"https://www.bbc.co.uk/news/articles/c1l10mdrld5o\"},{\"id\":\"ts9\",\"headline\":\"One killed, three injured in sword attack at a Swedish high school\",\"category\":\"World News\",\"summary\":\"Swedish police said one person died and three others were hurt, two of them seriously, in an attack at a high school in Fagersta. Police have not given a motive.\",\"source\":\"CNA, BBC, The Straits Times\",\"published_at\":\"2026-08-21T21:32+08:00\",\"url\":\"https://www.straitstimes.com/world/europe/several-people-injured-in-sword-attack-at-swedish-high-school\"},{\"id\":\"ts10\",\"headline\":\"Dutch regulator fines Uber €825 million over automated driver account suspensions\",\"category\":\"Business & Tech\",\"summary\":\"The Netherlands' data protection authority fined Uber €825 million (S$1.2 billion) for deactivating drivers' accounts without telling them, in breach of the EU rule that people should not be subject to decisions based solely on automated processing. The case covers 2020 to 2022 and began with a complaint filed in France, but was heard in the Netherlands because Uber's European headquarters are in Amsterdam. Uber calls the fine disproportionate and will appeal.\",\"source\":\"The Straits Times\",\"published_at\":\"2026-08-22T01:08+08:00\",\"url\":\"https://www.straitstimes.com/world/europe/netherlands-fines-ride-hailing-giant-uber-1-2-billion-for-suspending-driver-accounts\"},{\"id\":\"ts11\",\"headline\":\"Met Office forecasts the biggest El Nino in more than a century\",\"category\":\"Climate\",\"summary\":\"Adam Scaife, head of long-range forecasting at Britain's Met Office, said this year's El Nino is expected to peak at over 3 deg C above the baseline in the tropical eastern Pacific - a level he called unheard of in modern climate records. He warned of severe droughts in South America and the West Pacific and knock-on effects on food security. The forecast is a single national agency's projection, not an observed value.\",\"source\":\"The Straits Times, CNA\",\"published_at\":\"2026-08-21T17:09+08:00\",\"url\":\"https://www.straitstimes.com/world/british-forecaster-predicts-biggest-strongest-el-nino-in-living-memory\"},{\"id\":\"ts12\",\"headline\":\"DR Congo to trial an Ebola vaccine as the UN says the outbreak is growing exponentially\",\"category\":\"Health\",\"summary\":\"The Democratic Republic of the Congo is rolling out the Ervebo vaccine, with some doses used in a trial to test whether it works against the Bundibugyo species driving the current epidemic - there is no approved vaccine or treatment for that strain. Senior UN Ebola coordinator Julien Harneis said the outbreak is spreading across an area larger than France, that the death toll now tops 2,500, and that about 160 health workers have fallen ill and 43 have died. He said existing funding runs out within weeks.\",\"source\":\"BBC, The Straits Times\",\"published_at\":\"2026-08-21T20:57+08:00\",\"url\":\"https://www.straitstimes.com/world/ebola-spreading-exponentially-in-congo-as-death-toll-tops-2500-un-says\"},{\"id\":\"ts13\",\"headline\":\"Trump scales back South Korea drills and signals a fresh meeting with Kim Jong Un\",\"category\":\"Geopolitics\",\"summary\":\"CNA reports President Donald Trump trimmed joint military exercises with Seoul this week while signalling plans to meet North Korean leader Kim Jong Un later this year, reviving the summit diplomacy of his first term. Pyongyang has not publicly accepted; South Korea estimates the North now holds up to 120 nuclear warheads.\",\"source\":\"CNA\",\"published_at\":\"2026-08-22T06:00+08:00\",\"url\":\"https://www.channelnewsasia.com/east-asia/trump-kim-jong-un-south-korea-military-exercises-cna-explains-6331066\"},{\"id\":\"ts14\",\"headline\":\"China and Indonesia agree to deepen military ties and cooperation on minerals, energy and tech\",\"category\":\"Geopolitics\",\"summary\":\"Beijing and Jakarta agreed to expand defence cooperation and work more closely on critical minerals, energy and technology. President Prabowo Subianto has continued to frame Indonesia's approach as a 'free and active' non-aligned foreign policy, saying it will befriend all countries including both China and the United States.\",\"source\":\"CNA\",\"published_at\":\"2026-08-21T17:10+08:00\",\"url\":\"https://www.channelnewsasia.com/asia/china-indonesia-military-ties-minerals-energy-tech-6333081\"},{\"id\":\"ts15\",\"headline\":\"Sarawak shuts nearly 600 schools for two days as haze pushes air quality to 'very unhealthy'\",\"category\":\"Southeast Asia\",\"summary\":\"The East Malaysian state ordered two-day closures affecting around 200,000 students after air pollutant index readings hit 'very unhealthy' levels, with smoke drifting from Kalimantan. The same haze has reached Singapore, where MUIS shortened Friday sermons because of the air quality and heat.\",\"source\":\"CNA\",\"published_at\":\"2026-08-21T14:22+08:00\",\"url\":\"https://www.channelnewsasia.com/asia/malaysia-sarawak-haze-worsens-serian-kalimantan-6332896\"},{\"id\":\"ts16\",\"headline\":\"Japan protests Russian missile tests near the disputed Kuril Islands\",\"category\":\"Geopolitics\",\"summary\":\"Tokyo lodged a formal protest over Russian missile drills conducted off the islands Japan calls the Northern Territories, held days before an expected visit by President Vladimir Putin. The islands have been under Russian control since 1945 and Japan has never recognised the seizure.\",\"source\":\"CNA\",\"published_at\":\"2026-08-21T18:42+08:00\",\"url\":\"https://www.channelnewsasia.com/east-asia/japan-protests-russia-missile-tests-disputed-islands-putin-visit-6333311\"},{\"id\":\"ts17\",\"headline\":\"Prince Harry and six others ordered to pay the Daily Mail's publisher £9.5 million\",\"category\":\"World News\",\"summary\":\"A UK court ordered Prince Harry, Elton John and five other claimants to cover Associated Newspapers' costs after their unlawful-information-gathering case against the Daily Mail's publisher failed, with an initial payment of about £9.5 million (S$16 million).\",\"source\":\"CNA, The Straits Times\",\"published_at\":\"2026-08-21T22:27+08:00\",\"url\":\"https://www.channelnewsasia.com/world/prince-harry-elton-john-others-ordered-pay-daily-mail-uk-courts-6333676\"}]},\"singapore\":{\"label\":\"Singapore\",\"ai_summary\":\"HDB will cut compulsory service fees at assisted-living community care apartments by 18 to 75 per cent from 2027 and open them to buyers from age 55, after three of the five projects launched went undersubscribed. Enforcement filled out the rest of the day: LTA wants authorised exporters rather than owners to be responsible for deregistered cars, after illegal use of them on the roads nearly doubled. Scams were the steady drumbeat, from Apple impersonation calls that drained S$195,000 in crypto in a fortnight to AI-cloned influencers selling eyelashes on TikTok. The talk online ran gentler than the news, mostly to small kindnesses - the elderly wanton mee stallholder shoved over a head-pat is now fielding a queue of well-wishers. PM Wong's National Day Rally is on Sunday evening, with roads around ITE College Central shut all day.\",\"weather\":{\"forecast\":\"Windy\",\"temp_low\":25,\"temp_high\":35,\"humidity_low\":50,\"humidity_high\":85,\"as_of\":\"2026-08-22T05:30+08:00\",\"source\":\"NEA\",\"url\":\"https://www.weather.gov.sg/weather-forecast-24hrforecast/\"},\"coe\":{\"exercise\":\"Aug 2026 · 2nd bidding\",\"as_of\":\"2026-08-19\",\"next_results\":\"2026-09-09\",\"source\":\"LTA\",\"url\":\"https://data.gov.sg/datasets/d_69b3380ad7e51aff3a7dcc84eba52b8a/view\",\"categories\":[{\"code\":\"A\",\"label\":\"Cars up to 1600cc & 130bhp\",\"premium\":128501,\"change\":4611},{\"code\":\"B\",\"label\":\"Cars above 1600cc or 130bhp\",\"premium\":131001,\"change\":1091}]},\"stories\":[{\"id\":\"sg1\",\"headline\":\"LTA proposes shifting responsibility for deregistered cars to authorised exporters\",\"category\":\"Transport\",\"summary\":\"The Land Transport Authority is consulting on an Authorised Exporter Scheme under which owners who hand a deregistered car to an authorised person would no longer carry disposal obligations, with the exporter having to prove to LTA that the vehicle was properly disposed of. LTA is also considering paying out residual COE and PARF rebates immediately on handover, instead of the four to seven days dealers say they wait now. It follows a rise in deregistered vehicles being driven illegally - 122 cases in the first five months of 2026, close to double the whole of 2024. Feedback closes on Aug 28.\",\"source\":\"The Straits Times\",\"published_at\":\"2026-08-22T07:00+08:00\",\"url\":\"https://www.straitstimes.com/singapore/transport/lta-proposes-tighter-rules-for-deregistered-cars-amid-rise-in-illegal-use-on-roads\"},{\"id\":\"sg2\",\"headline\":\"Community care apartment fees to be cut by 18-75% and eligibility age lowered to 55\",\"category\":\"Housing\",\"summary\":\"After three of the five assisted-living HDB projects launched were undersubscribed - the Sengkang project drew only 0.7 applicants per unit - authorities will lower the compulsory monthly basic service package fees by 18 to 75 per cent from 2027 and drop the minimum buyer age from 65 to 55. Community care apartments are a joint MOH, MND and HDB offering pairing senior-friendly flats with care and social services.\",\"source\":\"The Straits Times\",\"published_at\":\"2026-08-22T05:00+08:00\",\"url\":\"https://www.straitstimes.com/singapore/housing/costs-of-public-community-care-apartments-reduced-basic-services-cut-following-lacklustre-demand\"},{\"id\":\"sg3\",\"headline\":\"National Day Rally on Aug 23: road closures in Ang Mo Kio, speech at 6.45pm\",\"category\":\"Government\",\"summary\":\"Police said roads and lanes near ITE College Central in Ang Mo Kio - including Ang Mo Kio Drive and slip roads to and from Ang Mo Kio Avenue 5 - will be closed to vehicles from 5am to 11.59pm on Aug 23, with illegally parked vehicles liable to be towed. Prime Minister Lawrence Wong's speech, his third National Day Rally, begins at 6.45pm and will be broadcast on TV, radio and online.\",\"source\":\"The Straits Times\",\"published_at\":\"2026-08-21T17:41+08:00\",\"url\":\"https://www.straitstimes.com/singapore/national-day-rally-2026-expect-road-lane-closures-in-ang-mo-kio-on-aug-23\"},{\"id\":\"sg4\",\"headline\":\"Analysts expect marriage, parenthood and the social contract to lead the Rally agenda\",\"category\":\"Government\",\"summary\":\"Ahead of Sunday's National Day Rally, analysts told The Straits Times they expect PM Wong to focus on marriage and parenthood support and on Singapore's evolving social compact, alongside cost-of-living and jobs concerns. These are expectations, not a published agenda - the Prime Minister's Office has not previewed the speech.\",\"source\":\"The Straits Times\",\"published_at\":\"2026-08-22T05:00+08:00\",\"url\":\"https://www.straitstimes.com/singapore/politics/marriage-and-parenthood-spores-evolving-social-contract-set-to-lead-rally-agenda-analysts\"},{\"id\":\"sg5\",\"headline\":\"DBS and POSB digital payments hit by a short disruption before midnight\",\"category\":\"Banking\",\"summary\":\"DBS said at about 11.20pm on Aug 21 that customers using FAST, PayNow and SGQR on digibank and PayLah may be affected, advising them to use cards and ATMs in the meantime. It posted an update just before midnight saying services were back to normal as at 11.34pm, and that deposits remained safe. Downdetector logged a spike in reports from about 10.15pm. It is the bank's third disruption this year, after outages in March and July.\",\"source\":\"The Straits Times\",\"published_at\":\"2026-08-22T00:15+08:00\",\"url\":\"https://www.straitstimes.com/singapore/dbs-posb-digital-payment-services-restored-after-short-disruption\"},{\"id\":\"sg6\",\"headline\":\"LTA to use AI on existing bus cameras to catch bus-lane offenders and spot road defects\",\"category\":\"Transport\",\"summary\":\"The system, which runs on cameras already fitted to buses, hit an average 90 per cent accuracy in trials. Deployment starts in the fourth quarter of 2026 and is due to cover all bus routes by 2030, flagging vehicles encroaching into bus lanes as well as potholes and other road defects.\",\"source\":\"CNA, The Straits Times\",\"published_at\":\"2026-08-21T13:39+08:00\",\"url\":\"https://www.channelnewsasia.com/singapore/lta-ai-bus-camera-traffic-violations-road-defects-6332771\"},{\"id\":\"sg7\",\"headline\":\"Friday sermons at mosques shortened temporarily because of heat and haze\",\"category\":\"Health & Weather\",\"summary\":\"MUIS said it was making 'a small but necessary adjustment' to the Friday sermon as the weather turns hotter and parts of Singapore begin to see haze. The measure is temporary and applies across mosques.\",\"source\":\"CNA, The Straits Times\",\"published_at\":\"2026-08-21T14:58+08:00\",\"url\":\"https://www.straitstimes.com/singapore/friday-sermons-at-singapore-mosques-temporarily-shortened-due-to-hot-weather-haze\"},{\"id\":\"sg8\",\"headline\":\"HSA halts sales and recalls a Medicube cream suspected of containing a prohibited dye\",\"category\":\"Health\",\"summary\":\"The Health Sciences Authority said it worked with the three companies marketing Medicube PDRN Pink Collagen Capsule Cream to suspend sales and recall the product, which is suspected of containing Sudan Red - a dye barred from cosmetics over carcinogenicity and allergy concerns - and has opened an investigation. Hong Kong Customs issued its own warning about the same product on Jul 24. Consumers who bought it are advised to stop using it.\",\"source\":\"Mothership\",\"published_at\":\"2026-08-21T17:30+08:00\",\"url\":\"https://mothership.sg/2026/08/hsa-recall-medicube-pdrn-pink-collagen-capsule-cream/\"},{\"id\":\"sg9\",\"headline\":\"81 arrested in a four-day islandwide CNB operation; weapons found in a Punggol flat\",\"category\":\"Crime\",\"summary\":\"The Central Narcotics Bureau said 81 suspected drug offenders were arrested and drugs worth more than S$105,500 seized. Katanas and knuckledusters were recovered from a flat in Punggol.\",\"source\":\"CNA, The Straits Times, Mothership\",\"published_at\":\"2026-08-21T16:15+08:00\",\"url\":\"https://www.channelnewsasia.com/singapore/cnb-arrest-81-drugs-s105000-6332951\"},{\"id\":\"sg10\",\"headline\":\"Town council managing agent employee charged over S$220,000 in alleged bribes\",\"category\":\"Courts\",\"summary\":\"Phua Gim Chuan, 63, a senior project manager at EM Services, is accused of agreeing to accept S$220,000 from company directors in connection with contract proposals involving several town councils. Mothership reported that the money was allegedly used to buy a Mercedes-Benz. The charges have not been tested in court.\",\"source\":\"CNA, The Straits Times, Mothership\",\"published_at\":\"2026-08-21T11:04+08:00\",\"url\":\"https://www.channelnewsasia.com/singapore/town-council-managing-agent-corruption-em-services-6331056\"},{\"id\":\"sg11\",\"headline\":\"Man who stabbed a priest during mass at St Joseph's Church jailed and caned\",\"category\":\"Courts\",\"summary\":\"Basnayake Keith Spencer, 38, was sentenced to four years and three months' jail and nine strokes of the cane for stabbing Father Christopher Lee Kwong Heng in the mouth with a partially serrated folding knife during communion at a children's mass in November 2024.\",\"source\":\"CNA, The Straits Times, Mothership\",\"published_at\":\"2026-08-21T11:46+08:00\",\"url\":\"https://www.straitstimes.com/singapore/courts-crime/man-who-stabbed-st-josephs-church-priest-in-2024-gets-over-four-years-jail-nine-strokes-of-cane\"},{\"id\":\"sg12\",\"headline\":\"Nearly 10 years' jail and caning for man who abused a six-year-old for 18 hours\",\"category\":\"Courts\",\"summary\":\"The 31-year-old Singaporean was sentenced to nine years and 10 months' jail and caning after abusing primary school pupils he was tutoring. The court heard he beat his youngest victim with a hanger more than 600 times, made the six-year-old hold a push-up position for hours, forced him to drink his own urine and made him sleep in the toilet.\",\"source\":\"CNA, The Straits Times, Mothership\",\"published_at\":\"2026-08-21T14:33+08:00\",\"url\":\"https://www.straitstimes.com/singapore/courts-crime/almost-10-years-jail-for-sporean-who-abused-primary-school-pupils-forced-6-year-old-boy-to-drink\"},{\"id\":\"sg13\",\"headline\":\"Tradeluxury director charged with money laundering in S$32 million luxury goods scam\",\"category\":\"Courts\",\"summary\":\"The director of Tradeluxury faces money laundering charges in the Tradenation case, while a woman was separately charged with allegedly handling S$35,000 of the proceeds. Thai authorities provisionally seized several properties in June, and Singapore's Commercial Affairs Department is helping victims consolidate claims for possible recovery. None of the allegations has been proven in court.\",\"source\":\"CNA, The Straits Times\",\"published_at\":\"2026-08-21T17:16+08:00\",\"url\":\"https://www.channelnewsasia.com/singapore/tradeluxury-goods-scam-cheating-bags-preorders-moneylaundering-6333061\"},{\"id\":\"sg14\",\"headline\":\"Apple impersonation scams cost Singapore victims at least S$195,000 in crypto in two weeks\",\"category\":\"Scams\",\"summary\":\"Police said at least five cases have been reported since Aug 7. Victims get a pop-up on their Apple device claiming unauthorised access to their account, then an unsolicited call - often from a +1 North American number - from someone posing as Apple technical support, who extracts the Apple ID, crypto account details and one-time passwords via fake sites such as chat-apple.com. Apple never asks for credentials by call or pop-up; suspicious calls can be reported to the ScamShield Helpline.\",\"source\":\"The Straits Times\",\"published_at\":\"2026-08-21T15:19+08:00\",\"url\":\"https://www.straitstimes.com/singapore/apple-impersonation-scams-cost-spore-victims-at-least-195k-in-crypto-assets-within-2-weeks\"},{\"id\":\"sg15\",\"headline\":\"CNA dissects how scammers faked a Zoom call featuring PM Wong and other leaders\",\"category\":\"Scams\",\"summary\":\"Analysis of the full footage, shared exclusively with CNA, found the scammers stitched together obscure and dated YouTube clips of high-profile figures with other deceptive techniques to make a fabricated virtual event look convincing. The piece breaks down the tells viewers can look for.\",\"source\":\"CNA\",\"published_at\":\"2026-08-22T06:00+08:00\",\"url\":\"https://www.channelnewsasia.com/singapore/zoom-scam-5-million-analysis-full-video-6332621\"},{\"id\":\"sg16\",\"headline\":\"TikTok ads use AI clones of influencer Dewy Choo and actor Zhang Linghe to target Singaporeans\",\"category\":\"Scams\",\"summary\":\"Influencer Dewy Choo, who has close to half a million followers, found her likeness and voice hijacked without consent in a TikTok advertisement selling false eyelashes. Ads from the same anonymous account used AI-generated images of Chinese actor Zhang Linghe placed at East Coast Park and Marina Bay to sell mascara and caps.\",\"source\":\"The Straits Times\",\"published_at\":\"2026-08-21T20:00+08:00\",\"url\":\"https://www.straitstimes.com/tech/tiktok-ads-use-ai-clones-of-popular-figures-dewy-choo-zhang-linghe-to-target-sporeans\"},{\"id\":\"sg17\",\"headline\":\"Police block a website that falsely claimed links to Singapore's foreign ministry\",\"category\":\"Government\",\"summary\":\"Singapore police blocked access to a site that falsely represented itself as connected to the Ministry of Foreign Affairs. CNA reported that the websites of two other entities describing themselves as a Singapore-headquartered consultancy and think-tank were also no longer accessible.\",\"source\":\"CNA\",\"published_at\":\"2026-08-21T20:38+08:00\",\"url\":\"https://www.channelnewsasia.com/singapore/global-asia-false-website-blocked-police-6333411\"},{\"id\":\"sg18\",\"headline\":\"Government begins beta testing a chatbot to make official information easier to find\",\"category\":\"Government\",\"summary\":\"GovTech and the Public Service Division said the chatbot is meant to help members of the public reach official information more easily, and stressed it is not a replacement for helplines or for officers who speak with the public.\",\"source\":\"CNA\",\"published_at\":\"2026-08-21T19:00+08:00\",\"url\":\"https://www.channelnewsasia.com/singapore/ai-chatbot-government-information-6333261\"},{\"id\":\"sg19\",\"headline\":\"Four operators cleared to add 200MW of data centre capacity under green energy conditions\",\"category\":\"Business & Tech\",\"summary\":\"Digital Realty, Equinix, Keppel Data Centres and ST Telemedia Global Data Centres were each allocated 50MW, beating more than 16 other proposals in the second Data Centre Call for Application run by EDB and IMDA since Dec 1, 2025. Each has committed to powering more than half the new capacity from green energy sources.\",\"source\":\"The Straits Times\",\"published_at\":\"2026-08-21T12:25+08:00\",\"url\":\"https://www.straitstimes.com/tech/four-operators-approved-to-expand-data-centres-200mw-of-new-capacity-allocated\"},{\"id\":\"sg20\",\"headline\":\"3,000 lower-income residents in the north-east to get $500 each in warm meal credits\",\"category\":\"Community\",\"summary\":\"OCBC and the North East CDC launched Warm Meals @ North East on Aug 21, giving 1,000 households in Tampines, Punggol and Pasir Ris-Changi $500 in meal credits each - about 165 meals - redeemable at roughly 30 food lockers at or near HDB rental block void decks. The programme aims to provide 165,000 meals to more than 3,000 residents over a year from September.\",\"source\":\"The Straits Times, CNA\",\"published_at\":\"2026-08-21T18:58+08:00\",\"url\":\"https://www.straitstimes.com/singapore/community/3000-lower-income-residents-in-north-east-towns-to-get-500-in-warm-meals-under-new-programme\"},{\"id\":\"sg21\",\"headline\":\"Singapore and Vietnam to hold their first strategic dialogue on Aug 25\",\"category\":\"Foreign Relations\",\"summary\":\"Coordinating Minister for Public Services and Defence Minister Chan Chun Sing will co-chair the inaugural Singapore-Vietnam Strategic Dialogue with Tran Cam Tu of the Communist Party of Vietnam's Central Committee Secretariat, the Public Service Division said. The agenda covers governance, leadership development, public service transformation and technology cooperation under the two countries' Comprehensive Strategic Partnership.\",\"source\":\"The Straits Times\",\"published_at\":\"2026-08-21T18:45+08:00\",\"url\":\"https://www.straitstimes.com/singapore/singapore-vietnam-to-hold-inaugural-strategic-dialogue-on-aug-25\"},{\"id\":\"sg22\",\"headline\":\"Singaporean man, 56, jailed 14 days and fined in Johor for insulting Islam\",\"category\":\"Foreign Relations\",\"summary\":\"Mohamed Anim Atam was sentenced by a Johor court after a video recorded by an e-hailing driver, in which he made remarks about the Quran while travelling in Johor Bahru, circulated online. CNA reported the fine as about US$1,733; Mothership put it at S$2,192.\",\"source\":\"CNA, Mothership\",\"published_at\":\"2026-08-21T17:17+08:00\",\"url\":\"https://www.channelnewsasia.com/asia/malaysia-johor-bahru-singaporean-jailed-insulting-islam-quran-6333141\"},{\"id\":\"sg23\",\"headline\":\"MOM looking into claim that an airport wheelchair assistant had S$5 docked for being 11 seconds late\",\"category\":\"Employment\",\"summary\":\"The Ministry of Manpower said it has contacted the employer to establish the nature and extent of the deductions after the claim circulated online. The worker is employed through a contractor providing wheelchair assistance at Changi Airport.\",\"source\":\"CNA, The Straits Times\",\"published_at\":\"2026-08-21T16:50+08:00\",\"url\":\"https://www.channelnewsasia.com/singapore/airport-wheelchair-assistant-pay-deduction-mom-sats-aventa-services-6325211\"},{\"id\":\"sg24\",\"headline\":\"YouTube Premium raises prices in Singapore across all subscription plans\",\"category\":\"Cost of Living\",\"summary\":\"YouTube emailed Singapore subscribers to say prices are going up across its Premium plans. The increase affects individual, family and student tiers.\",\"source\":\"CNA, The Straits Times\",\"published_at\":\"2026-08-21T14:35+08:00\",\"url\":\"https://www.channelnewsasia.com/living/youtube-premium-singapore-price-increase-6332871\"},{\"id\":\"sg25\",\"headline\":\"Police appeal for information on a missing 13-year-old girl last seen in Jurong West\",\"category\":\"Police\",\"summary\":\"The girl was last seen near Westwood Avenue on Aug 19. Anyone with information is asked to contact the police.\",\"source\":\"The Straits Times, Mothership\",\"published_at\":\"2026-08-21T16:44+08:00\",\"url\":\"https://www.straitstimes.com/singapore/missing-girl-13-last-seen-near-westwood-ave-in-jurong-west-on-aug-19\"},{\"id\":\"sg26\",\"headline\":\"Director of firms linked to more than 400 unpaid migrant workers declared bankrupt\",\"category\":\"Employment\",\"summary\":\"A bankruptcy order was made on Aug 13 against Ramu Palani Velu, an Indian national and Singapore permanent resident who directs seven local companies in air-conditioning, plumbing and building works. In June, more than 400 workers from three of them - VVR Plant Engineering, SK Industries and KPA Engineering - lodged claims for unpaid wages, some saying they had gone about three months without salary.\",\"source\":\"Mothership, The Straits Times\",\"published_at\":\"2026-08-21T11:10+08:00\",\"url\":\"https://mothership.sg/2026/08/unpaid-migrant-workers-director-bankrupt/\"},{\"id\":\"sg27\",\"headline\":\"Licensed debt collectors found to have breached the harassment law four times\",\"category\":\"Courts\",\"summary\":\"In grounds of decision released on Aug 19, Protection from Harassment Court Judge Gregory Gan found employees of a licensed debt collection firm breached the Protection from Harassment Act on four occasions while pursuing an alleged private debt - shouting insults and threats at the debtor's home and visiting her husband's workplace to hand staff notices about a debt unrelated to his job. A licence, the judge said, is not 'carte blanche' to break the law.\",\"source\":\"Mothership\",\"published_at\":\"2026-08-21T18:25+08:00\",\"url\":\"https://mothership.sg/2026/08/debt-collectors-broke-law/\"},{\"id\":\"sg28\",\"headline\":\"PUB says the Pandan Reservoir crocodile photo was fake; police report lodged\",\"category\":\"Environment\",\"summary\":\"Water activities at the reservoir were suspended after PUB was alerted to a reported sighting at about 3pm on Aug 20. The agency later said the circulating photo was found to be fake and filed a police report. Residents nearby had already shrugged the report off, telling CNA it was 'nothing special'.\",\"source\":\"CNA, The Straits Times, Mothership\",\"published_at\":\"2026-08-21T20:50+08:00\",\"url\":\"https://www.channelnewsasia.com/singapore/pub-pandan-reservoir-crocodile-sighting-fake-photo-police-report-6333501\"},{\"id\":\"sg29\",\"headline\":\"Consumer watchdog warns of 'compensation' phishing e-mails\",\"category\":\"Scams\",\"summary\":\"CASE warned of e-mails promising compensation payouts that are designed to harvest personal and payment details, urging recipients not to click through or share information.\",\"source\":\"The Straits Times\",\"published_at\":\"2026-08-21T13:29+08:00\",\"url\":\"https://www.straitstimes.com/singapore/compensation-or-con-pensation-spore-consumer-watchdog-warns-of-e-mail-phishing-attempts\"},{\"id\":\"sg30\",\"headline\":\"Two Traffic Police officers hospitalised after a vehicle caught fire on the BKE\",\"category\":\"Police\",\"summary\":\"The officers were taken to hospital for smoke inhalation after a vehicle fire on the Bukit Timah Expressway on Aug 21.\",\"source\":\"The Straits Times\",\"published_at\":\"2026-08-21T23:50+08:00\",\"url\":\"https://www.straitstimes.com/singapore/2-traffic-police-officers-taken-to-hospital-for-smoke-inhalation-after-vehicle-catches-fire-on-bke\"},{\"id\":\"sg31\",\"headline\":\"Customers bring gifts and children to the Roxy Square wanton mee uncle after he was shoved\",\"category\":\"Trending\",\"summary\":\"Mr Yeo Song Khoon, the elderly stallholder pushed over after patting a child on the head, has been drawing a stream of well-wishers. One father, 40, brought his daughter specifically to encourage him to keep interacting with young customers. Mr Yeo is mostly seated at his stall and walks unsteadily; his family has said he has had difficulty walking for years.\",\"source\":\"CNA, Mothership\",\"published_at\":\"2026-08-21T17:05+08:00\",\"url\":\"https://www.channelnewsasia.com/singapore/roxy-square-wanton-noodles-head-pat-customers-children-6333011\"},{\"id\":\"sg32\",\"headline\":\"Beatty Secondary students track down a wallet's owner through his NRIC and return it intact\",\"category\":\"Trending\",\"summary\":\"A TikTok user posted CCTV footage of three students at his door with the wallet and its contents untouched, after finding it on a bus and using the address on his NRIC to locate him. 'Your money also inside, I never steal,' one is heard saying to the camera when nobody answered the door.\",\"source\":\"Mothership\",\"published_at\":\"2026-08-21T19:03+08:00\",\"url\":\"https://mothership.sg/2026/08/beatty-sec-school-wallet/\"},{\"id\":\"sg33\",\"headline\":\"Fake Mothership account pushes bogus S$139 Rolex deals\",\"category\":\"Trending\",\"summary\":\"Mothership said readers alerted it to an impersonation account advertising heavily discounted watches, including S$139 Rolexes. The outlet is not offering any watch discounts; the page appears to have been taken down and Mothership says it is working with authorities on other impersonation accounts.\",\"source\":\"Mothership\",\"published_at\":\"2026-08-21T18:06+08:00\",\"url\":\"https://mothership.sg/2026/08/fake-mothership-rolex-139/\"},{\"id\":\"sg34\",\"headline\":\"Actor Elvin Ng shares the decision to euthanise his 17-year-old dog\",\"category\":\"Trending\",\"summary\":\"The 45-year-old posted on Instagram on Aug 18 about putting down Bagel, a shelter dog he adopted nine years ago when she was about eight. He wrote that the vet advised it as she was frail and likely in pain, called it 'a very difficult action to take' and said he felt guilty.\",\"source\":\"Mothership\",\"published_at\":\"2026-08-21T12:15+08:00\",\"url\":\"https://mothership.sg/2026/08/elvin-ng-dog-die/\"},{\"id\":\"sg35\",\"headline\":\"Japan Home stores reopen in Singapore under the operator behind Valu$\",\"category\":\"Trending\",\"summary\":\"Parent company IH Retail said all its Singapore stores resumed on Aug 20 after several were found shuttered or closed for stocktaking. An indirect subsidiary signed a three-year master franchise agreement on Aug 13 with Radha Export, which runs the ABC and Valu$ chains; the handover was completed on Aug 19 and Valu$ goods have begun appearing on the shelves.\",\"source\":\"Mothership\",\"published_at\":\"2026-08-21T10:37+08:00\",\"url\":\"https://mothership.sg/2026/08/japan-home-reopen/\"},{\"id\":\"sg36\",\"headline\":\"Blackpink's Jennie: agency says it will sue over a 'maliciously edited' performance clip\",\"category\":\"Trending\",\"summary\":\"OA Entertainment said it will pursue civil and criminal action over malicious online content targeting the singer, vowing 'no settlement or leniency', after an unverified clip from her Summer Sonic 2026 set in Japan spread online. The clip's authenticity has not been established and the account that posted it has been suspended; in South Korea, even viewing non-consensual deepfake material can carry up to three years in prison.\",\"source\":\"Mothership\",\"published_at\":\"2026-08-21T10:43+08:00\",\"url\":\"https://mothership.sg/2026/08/jennie-manipulated-photos/\"},{\"id\":\"sg37\",\"headline\":\"Video of a woman collecting roadside Hungry Ghost offerings sparks debate\",\"category\":\"Trending\",\"summary\":\"Shin Min Daily News reported that a woman who said she was from Sichuan and works as a bus driver in Singapore filmed herself picking up apples and oranges left as festival offerings, saying 'it's not easy to work abroad, we have to save every penny' and that fruit is expensive here. The video has since been deleted.\",\"source\":\"Mothership\",\"published_at\":\"2026-08-21T16:45+08:00\",\"url\":\"https://mothership.sg/2026/08/woman-pick-up-fruit-singapore-hungry-ghost/\"},{\"id\":\"sg38\",\"headline\":\"Passerby raises alarm after a teenage boy is seen injured in an alleged Yishun bullying incident\",\"category\":\"Trending\",\"summary\":\"A woman posted on Facebook that she saw a secondary school boy surrounded by a group at 462A Yishun Avenue 6 at about 6.10pm on Aug 19, with bruises on his leg and broken slippers, appearing weak and giddy. She told Lianhe Zaobao he left with the group anyway when she tried to intervene.\",\"source\":\"Mothership\",\"published_at\":\"2026-08-21T15:23+08:00\",\"url\":\"https://mothership.sg/2026/08/boy-bullied-injured-leaves-with-them/\"},{\"id\":\"sg39\",\"headline\":\"Elderly woman injured in an escalator fall at Yishun's Junction Nine\",\"category\":\"Trending\",\"summary\":\"Lianhe Zaobao reported the fall happened at about 4.45pm on Aug 19 on the escalator from the first to the second floor, and that she is believed to have been pushing a trolley onto it. Footage showed first responders treating her on the halted escalator; she appeared to have hurt her head but remained conscious.\",\"source\":\"Mothership\",\"published_at\":\"2026-08-21T17:30+08:00\",\"url\":\"https://mothership.sg/2026/08/elderly-woman-fall-escalator/\"},{\"id\":\"sg40\",\"headline\":\"Taiwan deports a Sri Lankan man to Singapore after he used a fake Canadian passport in transit\",\"category\":\"Trending\",\"summary\":\"Taiwan's National Immigration Agency said EVA Air ground staff at Taoyuan International Airport spotted discrepancies in the passport of a man transiting from Singapore to Toronto in mid-August, and officers confirmed it was fraudulent. Singapore's ICA said he had presented his Sri Lankan passport for immigration clearance here.\",\"source\":\"Mothership\",\"published_at\":\"2026-08-21T16:33+08:00\",\"url\":\"https://mothership.sg/2026/08/sri-lankan-man-singapore-taiwan-transit-canada/\"},{\"id\":\"sg41\",\"headline\":\"Singaporean, 46, charged in Johor over a road rage incident is a chicken rice restaurant owner\",\"category\":\"Trending\",\"summary\":\"Mothership identified the man charged in Malaysia with obstructing police and assaulting a 30-year-old Malaysian woman during a Johor road rage incident as the owner of a chicken rice restaurant. The charges have not been tested in court.\",\"source\":\"Mothership\",\"published_at\":\"2026-08-21T16:55+08:00\",\"url\":\"https://mothership.sg/2026/08/sporean-man-johor-road-rage-chicken-rice/\"},{\"id\":\"sg42\",\"headline\":\"Motorcyclist and pillion rider crash while fleeing police in Farrer Road; vape and drugs seized\",\"category\":\"Trending\",\"summary\":\"A 37-year-old rider with a 26-year-old pillion rider crashed after fleeing, and police said vaporisers and drugs were found.\",\"source\":\"Mothership\",\"published_at\":\"2026-08-21T15:31+08:00\",\"url\":\"https://mothership.sg/2026/08/motorcycle-flees-farrer-road-crash/\"},{\"id\":\"sg43\",\"headline\":\"A Michelin-starred dinner that is also a play: Nouri teams up with Checkpoint Theatre\",\"category\":\"Trending\",\"summary\":\"Restaurant Nouri and Checkpoint Theatre have built what CNA calls probably Singapore's first true fusion of fine dining and theatre - a 10-course, three-hour experience in which each course is paired with a chapter of chef Ivan Brehm's own story, with Brehm performing.\",\"source\":\"CNA\",\"published_at\":\"2026-08-22T07:11+08:00\",\"url\":\"https://www.channelnewsasia.com/dining/nouri-ivan-brehm-checkpoint-theatre-6332646\"},{\"id\":\"sg44\",\"headline\":\"Ex-teacher's Chinese-Muslim beef roti shops draw long queues\",\"category\":\"Trending\",\"summary\":\"Ameen Roti's two outlets - a 15-seater at Haji Lane and a takeaway stall at Century Square - are run by a former teacher who brought cooks over from his hometown to make the halal beef and chicken roti.\",\"source\":\"CNA\",\"published_at\":\"2026-08-21T11:11+08:00\",\"url\":\"https://www.channelnewsasia.com/dining/ameen-roti-beef-chicken-muslim-owned-6332456\"},{\"id\":\"sg45\",\"headline\":\"A Sherlock Holmes murder mystery to solve around Bugis\",\"category\":\"Trending\",\"summary\":\"Hidden has launched A Study In Red, an officially licensed Sherlock Holmes adventure running across Bugis Street, Bugis Junction and Bugis+, mixing real-world exploration with puzzle solving over about 90 minutes.\",\"source\":\"CNA\",\"published_at\":\"2026-08-21T11:10+08:00\",\"url\":\"https://www.channelnewsasia.com/living/sherlock-holmes-bugis-murder-mystery-game-hidden-6332486\"}]},\"wars\":{\"label\":\"Wars & Conflicts\",\"ai_summary\":\"A shopping centre in Kryvyi Rih was hit twice within half an hour on Friday, killing at least 16 - the clearest sign yet that Russia's escalation is aimed at cities and the emergency crews who respond to them, not the front line. In the Gulf the fight has moved onto the diplomatic calendar: Iran's president signalled he wants out, while Washington prepares an Aug 24 sanctions package meant to topple the government and NATO's commander quietly convened allies to plan Hormuz escort options he insists are not a NATO mission. The Israeli-Palestinian theatre is being contested through courts and settlement maps rather than battle lines, with Turkey seeking an Interpol notice for Netanyahu. All three theatres are now moving faster inside institutions than on the ground, which means the next fortnight's decisions get made in Brussels, Ankara and The Hague as much as in the field.\",\"theatres\":[{\"name\":\"Russia-Ukraine War\",\"status\":\"Russia's air war on cities is where the escalation is, not the front line. A double-tap drone strike on a Kryvyi Rih shopping centre on Aug 21 killed at least 16 and wounded more than 130 including 22 children, with a second drone arriving half an hour after the first; a separate strike in Mykolaiv killed four, three of them children. It followed a ballistic missile attack on Kyiv that killed 17 the day before. Diplomacy is stirring without a track: the French, British and German leaders will co-chair a meeting on Ukraine on Monday, while a senior Russian diplomat says Moscow will weigh new ideas only on its own terms. The pressure runs both ways - the BBC reports petrol shortages spreading inside Russia after months of Ukrainian strikes on refineries - and the espionage front widened with Russian claims of nine arrests and an Australian prosecution of a man accused of informing for Moscow.\",\"timeline\":[{\"date\":\"2022-02-24\",\"event\":\"Russia launches a full-scale invasion of Ukraine, opening the largest land war in Europe since 1945.\",\"source\":\"BBC\",\"url\":\"https://www.bbc.co.uk/news/world\"},{\"date\":\"2026-08-10\",\"event\":\"At least 13 people are killed in a Ukrainian drone strike deep inside Russia, according to Russian officials. The claim has not been independently verified.\",\"source\":\"BBC\",\"url\":\"https://www.bbc.co.uk/news/world/europe\"},{\"date\":\"2026-08-11\",\"event\":\"President Volodymyr Zelensky says Russia is using North Korean missiles to strike Ukraine. Moscow and Pyongyang have not confirmed the claim.\",\"source\":\"BBC\",\"url\":\"https://www.bbc.co.uk/news/world/europe\"},{\"date\":\"2026-08-13\",\"event\":\"Major Russian grain export terminals are hit in a Ukrainian attack on a Black Sea port, extending the campaign against Russian export infrastructure.\",\"source\":\"BBC\",\"url\":\"https://www.bbc.co.uk/news/world/europe\"},{\"date\":\"2026-08-14\",\"event\":\"Russia dismisses the idea of a Black Sea ceasefire, saying it sees no grounds for 'half-measures' that would give the other side a respite.\",\"source\":\"The Straits Times\",\"url\":\"https://www.straitstimes.com/world/europe\"},{\"date\":\"2026-08-14\",\"event\":\"NATO jets shoot down a drone that entered Latvian airspace, the latest spillover of the air war into alliance territory.\",\"source\":\"CNA\",\"url\":\"https://www.channelnewsasia.com/world\"},{\"date\":\"2026-08-15\",\"event\":\"Russia's defence ministry says its summer campaign has resulted in the capture of 19 settlements in southeastern Ukraine. Kyiv has not confirmed the claim.\",\"source\":\"The Straits Times\",\"url\":\"https://www.straitstimes.com/world/europe\"},{\"date\":\"2026-08-15\",\"event\":\"Ukraine's General Staff says long-range strikes hit the Progress Rocket Space Centre in Samara, some 900km inside Russia, and a military airfield.\",\"source\":\"The Straits Times, Ukrainska Pravda\",\"url\":\"https://www.straitstimes.com/world/europe\"},{\"date\":\"2026-08-16\",\"event\":\"Ukrainian drones kill five people in a residential area of Russia's Rostov region and three more in the Belgorod, Kursk and Moscow regions, regional governors say; four others are reported killed in Russian-occupied parts of Ukraine. Moscow's regional governor calls it 'one of the most massive drone attacks in recent memory' and Russia's defence ministry says it intercepted 822 drones overnight.\",\"source\":\"The Straits Times, AFP\",\"url\":\"https://www.straitstimes.com/world/europe/strikes-kill-19-in-ukraine-and-russia\"},{\"date\":\"2026-08-16\",\"event\":\"Russian drones and missiles kill two people and wound 14 at ArcelorMittal's steel plant in Kryvyi Rih, which partially halts production, and burn down stalls at Kyiv's Pochaina second-hand book market. Zelensky says Ukrainian cities were hit by more than 1,550 attack drones, nearly 1,560 guided bombs and 62 missiles over the past week, and renews his appeal for air defence.\",\"source\":\"The Straits Times, AFP\",\"url\":\"https://www.straitstimes.com/world/europe/strikes-kill-19-in-ukraine-and-russia\"},{\"date\":\"2026-08-16\",\"event\":\"A Spanish F-18 on NATO air-policing duty shoots down a drone that entered Romanian airspace from Moldova, about 24km north of Galati - the fourth drone downed over Romania this year.\",\"source\":\"The Straits Times\",\"url\":\"https://www.straitstimes.com/world/europe\"},{\"date\":\"2026-08-16\",\"event\":\"North Korean leader Kim Jong Un and President Vladimir Putin exchange messages reaffirming bilateral ties to mark Korean Liberation Day.\",\"source\":\"CNA\",\"url\":\"https://www.channelnewsasia.com/asia/north-koreas-kim-russias-putin-reaffirm-ties-korean-liberation-day-6321956\"},{\"date\":\"2026-08-17\",\"event\":\"Six people are killed and four injured, including a 14-year-old, in Ukrainian missile strikes on Russia's Belgorod region overnight, acting governor Alexander Shuvaev says on Telegram. A woman is also killed by a drone strike on a home in the Astrakhan region, its governor says. The claims have not been independently verified.\",\"source\":\"BBC\",\"url\":\"https://www.bbc.co.uk/news/articles/cn7n4lm11vro\"},{\"date\":\"2026-08-17\",\"event\":\"Russian forces attack port infrastructure in the Izmail district of Ukraine's Odesa region overnight, Ukrainian authorities say.\",\"source\":\"The Straits Times\",\"url\":\"https://www.straitstimes.com/world/europe/russia-hits-ukraines-izmail-and-odesa-ports-in-overnight-strikes\"},{\"date\":\"2026-08-17\",\"event\":\"Ukrainian energy company Naftogaz says Russia attacked its facilities 13 times over the past week.\",\"source\":\"BBC\",\"url\":\"https://www.bbc.co.uk/news/articles/cn7n4lm11vro\"},{\"date\":\"2026-08-17\",\"event\":\"EU foreign policy chief Kaja Kallas says the bloc plans its most far-reaching sanctions package against Russia in the autumn, without giving timing or detail.\",\"source\":\"The Straits Times\",\"url\":\"https://www.straitstimes.com/world/europe/eu-plans-most-far-reaching-sanctions-package-against-russia-in-autumn-foreign-chief-says\"},{\"date\":\"2026-08-17\",\"event\":\"Documents reported by The Straits Times show Binance gave Russian authorities client details later used to charge a Russian over donations to Ukraine.\",\"source\":\"The Straits Times\",\"url\":\"https://www.straitstimes.com/world/europe/binance-gave-moscow-client-details-used-to-charge-russian-over-ukraine-donations-documents-show\"},{\"date\":\"2026-08-17\",\"event\":\"Russia's defence ministry says air defences intercepted 205 Ukrainian drones over Russia and Crimea between Sunday night and Monday morning. Kyiv has not commented on the figure.\",\"source\":\"BBC, Al Jazeera\",\"url\":\"https://www.bbc.co.uk/news/articles/cn7n4lm11vro\"},{\"date\":\"2026-08-17\",\"event\":\"A separate overnight Russian attack on the Black Sea port city of Odesa damages a civilian vessel and injures four people, Ukrainian authorities say.\",\"source\":\"BBC, Al Jazeera\",\"url\":\"https://www.bbc.co.uk/news/articles/cn7n4lm11vro\"},{\"date\":\"2026-08-17\",\"event\":\"Moldova's foreign ministry condemns a violation of its airspace by an unidentified aerial object that later exploded on Moldovan territory. It did not name a country responsible.\",\"source\":\"The Straits Times\",\"url\":\"https://www.straitstimes.com/world/europe/moldovas-foreign-ministry-condemns-violation-of-airspace-explosion-of-aerial-object\"},{\"date\":\"2026-08-17\",\"event\":\"Italy's government says it sees no sign of a Russian link to the explosion at the Colleferro munitions plant, pushing back on speculation about sabotage.\",\"source\":\"The Straits Times\",\"url\":\"https://www.straitstimes.com/world/europe/italy-sees-no-sign-of-russian-link-to-colleferro-munitions-blast-minister-says\"},{\"date\":\"2026-08-17\",\"event\":\"A Russian court jails a prominent anti-war opposition politician for 11 years over comments about the war, the independent outlet Mediazona reports.\",\"source\":\"BBC, The Straits Times\",\"url\":\"https://www.bbc.co.uk/news/articles/cj4kjnle2neo\"},{\"date\":\"2026-08-18\",\"event\":\"Moscow warns of 'consequences' after reports that British-made drones were used in strikes on Russian territory. London has not confirmed the reports.\",\"source\":\"The Straits Times\",\"url\":\"https://www.straitstimes.com/world/europe/moscow-warns-of-consequences-after-reports-that-british-made-drones-hit-russia\"},{\"date\":\"2026-08-18\",\"event\":\"Moscow Mayor Sergei Sobyanin says 620 Ukrainian drones headed for the Moscow region between Monday evening and 5am and that 180 were downed over the region, in one of the largest attacks on the capital region of the war. Regional governor Andrei Vorobyov says drones hit a Wildberries warehouse and other sites and that three people, including a 10-year-old girl, were injured; Moscow's airports temporarily restricted flights. The figures are Russian officials' account and Kyiv has not commented.\",\"source\":\"The Straits Times\",\"url\":\"https://www.straitstimes.com/world/europe/russia-downs-180-drones-in-moscow-region-overnight-mayor-says\"},{\"date\":\"2026-08-18\",\"event\":\"Russia's foreign ministry says the United Kingdom 'will pay' for supplying drones used in strikes on Russian territory, hardening the earlier warning of 'consequences'. London has not confirmed that British-made drones were used.\",\"source\":\"BBC, The Straits Times\",\"url\":\"https://www.bbc.co.uk/news/articles/cy5dz0kkn0wo\"},{\"date\":\"2026-08-18\",\"event\":\"Russia summons Japan's ambassador over the disputed Kuril Islands, which Tokyo calls the Northern Territories. Japan has not detailed its response.\",\"source\":\"CNA, The Straits Times\",\"url\":\"https://www.channelnewsasia.com/east-asia/russia-japan-ambassador-disputed-kuril-islands-6324746\"},{\"date\":\"2026-08-18\",\"event\":\"Myanmar's leader Min Aung Hlaing is due in Moscow to meet President Vladimir Putin on his first trip there as president, one of a small number of leaders visiting Russia during the war.\",\"source\":\"The Straits Times\",\"url\":\"https://www.straitstimes.com/world/europe/myanmars-leader-to-meet-putin-on-first-moscow-trip-as-president\"},{\"date\":\"2026-08-18\",\"event\":\"A Russian missile attack kills 10 people in a village in Ukraine's north-eastern Kharkiv region, President Volodymyr Zelensky says, adding that Kyiv will respond. The figure is Ukraine's and has not been independently verified; Moscow has not commented.\",\"source\":\"The Straits Times\",\"url\":\"https://www.straitstimes.com/world/europe/russian-missile-attack-kills-10-in-ukraines-kharkiv-region-officials-say\"},{\"date\":\"2026-08-18\",\"event\":\"A court in Stuttgart convicts a Ukrainian man over what German prosecutors describe as a Russian intelligence-linked plot to detonate parcels in Europe. Moscow has denied involvement in previous parcel-bomb cases.\",\"source\":\"The Straits Times\",\"url\":\"https://www.straitstimes.com/world/europe/german-court-convicts-ukrainian-man-over-parcel-bomb-plot-tied-to-russia\"},{\"date\":\"2026-08-18\",\"event\":\"The IAEA says a drone exploded at a bus stop used by staff of the Russian-held Zaporizhzhia nuclear power plant, killing one person and injuring several others. Russian officials blame Ukraine and call it one of the most serious incidents at the plant; Kyiv has not commented. The IAEA reports no nuclear safety or security damage.\",\"source\":\"The Straits Times, IAEA\",\"url\":\"https://www.straitstimes.com/world/europe/iaea-drone-exploded-at-zaporizhzhia-nuclear-plant-bus-stop-killing-one\"},{\"date\":\"2026-08-18\",\"event\":\"Foreign Minister Sergei Lavrov says Russia has the right to treat British involvement in strikes on Russian territory as participation in the war, according to Interfax. London has not confirmed that British-made drones were used.\",\"source\":\"The Straits Times, Interfax\",\"url\":\"https://www.straitstimes.com/world/europe/russias-lavrov-says-britain-risks-being-seen-as-party-to-ukraine-war\"},{\"date\":\"2026-08-18\",\"event\":\"Greater Manchester mayor Andy Burnham says the United Kingdom 'supports Ukraine 100%' in response to Russia's warning over drones used against Russian territory.\",\"source\":\"BBC\",\"url\":\"https://www.bbc.co.uk/news/articles/cy5dz0kkn0wo\"},{\"date\":\"2026-08-18\",\"event\":\"Estonia's prime minister says the country is investigating whether Russia was involved in an arson attack last week on a building housing a defence contractor. No conclusion has been announced and Moscow has not commented.\",\"source\":\"The Straits Times\",\"url\":\"https://www.straitstimes.com/world/europe/estonia-pm-says-arson-attack-on-defence-contractor-may-be-linked-to-russia\"},{\"date\":\"2026-08-19\",\"event\":\"Ukraine's new defence minister takes office after a parliamentary vote, which the country's anti-corruption agencies had opened a probe ahead of.\",\"source\":\"The Straits Times\",\"url\":\"https://www.straitstimes.com/world/europe/ukraines-anti-corruption-agencies-launch-probe-ahead-of-key-defence-minister-vote\"},{\"date\":\"2026-08-19\",\"event\":\"Mykhailo Fedorov, removed as defence minister, publicly calls for a presidential election to be held during the war - the most direct domestic challenge to President Volodymyr Zelensky since the 2022 invasion. Ukraine has not held elections under martial law.\",\"source\":\"BBC, The Straits Times\",\"url\":\"https://www.bbc.co.uk/news/articles/cdew8n9erlwo\"},{\"date\":\"2026-08-19\",\"event\":\"German federal prosecutors say a second suspect in the 2022 Nord Stream pipeline sabotage investigation has been arrested in Croatia. Prosecutors have not published the suspect's identity or alleged role.\",\"source\":\"The Straits Times\",\"url\":\"https://www.straitstimes.com/world/europe/second-suspect-in-nord-stream-case-arrested-in-croatia-say-german-prosecutors\"},{\"date\":\"2026-08-19\",\"event\":\"The Straits Times reports that Russia's 'pivot to Asia' is prioritising ties with isolated states over larger economies, as Moscow's options for trade and diplomacy narrow.\",\"source\":\"The Straits Times\",\"url\":\"https://www.straitstimes.com/world/russias-pivot-to-asia-takes-a-turn-as-it-prioritises-ties-with-isolated-regimes-over-bigger\"},{\"date\":\"2026-08-19\",\"event\":\"Kim Yo Jong, sister of North Korean leader Kim Jong Un, denies President Volodymyr Zelensky's claim that Pyongyang is deploying additional troops to support Russia. Kyiv has not withdrawn the claim.\",\"source\":\"CNA\",\"url\":\"https://www.channelnewsasia.com/east-asia/north-korea-deny-russia-more-troops-ukraine-war-6328991\"},{\"date\":\"2026-08-19\",\"event\":\"Black Sea grain exports from both Russia and Ukraine grind to a virtual halt, The Straits Times reports, after weeks of strikes on port and terminal infrastructure on both sides.\",\"source\":\"The Straits Times\",\"url\":\"https://www.straitstimes.com/world/europe/russia-and-ukraines-black-sea-grain-exports-grind-to-a-virtual-halt\"},{\"date\":\"2026-08-19\",\"event\":\"A suspected sabotage attack fails to disrupt deliveries by Estonian defence manufacturer Milrem to Ukraine, according to the company. Investigators have not publicly attributed the attempt.\",\"source\":\"The Straits Times\",\"url\":\"https://www.straitstimes.com/world/europe/suspected-sabotage-attack-fails-to-disrupt-milrem-deliveries-to-ukraine\"},{\"date\":\"2026-08-19\",\"event\":\"Protests in Kyiv back former defence minister Mykhailo Fedorov's call for a wartime presidential election, Al Jazeera reports, turning his statement into the first visible street mobilisation on the question since 2022.\",\"source\":\"Al Jazeera\",\"url\":\"https://www.aljazeera.com/video/newsfeed/2026/8/19/19-08-reported-audreymacalpine-kyiv-ua\"},{\"date\":\"2026-08-19\",\"event\":\"Russia and Ukraine each hand over 103 prisoners of war in an exchange, one of the few channels between the two sides still operating.\",\"source\":\"The Straits Times\",\"url\":\"https://www.straitstimes.com/world/europe/russia-and-ukraine-swap-103-prisoners-of-war-each\"},{\"date\":\"2026-08-20\",\"event\":\"Ukrainian officials say at least 15 people were killed and dozens injured in an overnight ballistic-missile and drone attack on Kyiv, with a nine-storey residential block destroyed in Solomianskyi district and a children's hospital, a school and warehouses damaged. The toll was revised upward through the day from an initial five. Moscow has not commented on the toll.\",\"source\":\"BBC, CNN, The Moscow Times\",\"url\":\"https://www.bbc.co.uk/news/articles/c98vzmden5yo\"},{\"date\":\"2026-08-20\",\"event\":\"Ukraine's air force says Russia launched dozens of missiles and 168 drones overnight and that most cruise missiles and nearly 90% of the drones were downed, without specifying how many ballistic missiles were fired or intercepted. Officials say Kyiv is effectively defenceless against ballistic missiles because of an acute shortage of interceptors.\",\"source\":\"Ukrainian Air Force via BBC, NBC News\",\"url\":\"https://www.bbc.co.uk/news/articles/c98vzmden5yo\"},{\"date\":\"2026-08-20\",\"event\":\"German prosecutors say a Ukrainian man has been arrested in Croatia over the 2022 Nord Stream pipeline sabotage, the second arrest in the investigation. Prosecutors have not detailed his alleged role.\",\"source\":\"BBC, The Straits Times\",\"url\":\"https://www.bbc.co.uk/news/articles/c78gp7l5348o\"},{\"date\":\"2026-08-20\",\"event\":\"Mykhailo Fedorov, removed as defence minister, calls for a presidential election to be held during the war - the most direct domestic challenge yet to President Volodymyr Zelensky. The Kremlin says the call shows splits in Kyiv.\",\"source\":\"BBC, CNA, The Straits Times\",\"url\":\"https://www.bbc.co.uk/news/articles/cdew8n9erlwo\"},{\"date\":\"2026-08-20\",\"event\":\"Poland says it has arrested a man over an alleged plot to assassinate an official in Ukraine's arms industry. Warsaw has not named the suspect or the intended target.\",\"source\":\"The Straits Times\",\"url\":\"https://www.straitstimes.com/world/europe/poland-arrests-man-over-alleged-plot-to-assassinate-ukrainian-arms-industry-official\"},{\"date\":\"2026-08-20\",\"event\":\"Romania's defence minister says the country destroyed a marine drone near the Neptun Deep gas project in the Black Sea. Bucharest has not attributed the drone to a party.\",\"source\":\"The Straits Times\",\"url\":\"https://www.straitstimes.com/world/europe/romania-destroys-marine-drone-near-neptun-deep-gas-project-minister-says\"},{\"date\":\"2026-08-20\",\"event\":\"Black Sea grain exports from both Russia and Ukraine remain at a virtual halt after weeks of strikes on port and terminal infrastructure on both sides.\",\"source\":\"The Straits Times\",\"url\":\"https://www.straitstimes.com/world/europe/kremlin-says-ousted-ukrainian-ministers-call-for-elections-shows-splits-in-kyiv\"},{\"date\":\"2026-08-21\",\"event\":\"Ukraine's State Emergency Service says at least 17 people were killed and more than 40 injured in the overnight attack on Kyiv, which struck blocks of flats and warehouses and damaged a children's hospital and a school. CNA's earlier count was 16. The figures are Ukrainian and have not been independently verified.\",\"source\":\"BBC, CNA, The Straits Times (Ukraine State Emergency Service)\",\"url\":\"https://www.bbc.co.uk/news/articles/c98vzmden5yo\"},{\"date\":\"2026-08-21\",\"event\":\"Kyiv mayor Vitali Klitschko tells the BBC that critical infrastructure was 'purposefully attacked' for the first time in several months, disrupting hot water supply in parts of the city.\",\"source\":\"BBC\",\"url\":\"https://www.bbc.co.uk/news/articles/c98vzmden5yo\"},{\"date\":\"2026-08-21\",\"event\":\"President Volodymyr Zelensky says Ukraine urgently needs more Patriot interceptors and that the shortage is costing lives.\",\"source\":\"The Straits Times, CNA\",\"url\":\"https://www.straitstimes.com/world/europe/russian-strikes-kill-17-in-ukraine-zelensky-says-lack-of-patriots-costing-lives\"},{\"date\":\"2026-08-21\",\"event\":\"A senior Russian diplomat says Moscow is ready to consider new ideas on a Ukraine peace settlement but only on its own conditions, repeating that any talks must recognise the 'new realities on the ground'.\",\"source\":\"The Straits Times\",\"url\":\"https://www.straitstimes.com/world/europe/russia-is-ready-for-new-ideas-on-ukraine-peace-but-with-conditions-senior-diplomat-says\"},{\"date\":\"2026-08-21\",\"event\":\"Russia holds a rare missile test near the disputed islands north of Japan that Tokyo calls the Northern Territories.\",\"source\":\"The Straits Times\",\"url\":\"https://www.straitstimes.com/world/europe/russia-holds-rare-missile-test-near-islands-claimed-by-japan\"},{\"date\":\"2026-08-21\",\"event\":\"Australia charges a 27-year-old Russian-Australian citizen with foreign interference, alleging he joined Ukraine's armed forces to gather information on their military activities for Russia. The allegations have not been tested in court.\",\"source\":\"CNA\",\"url\":\"https://www.channelnewsasia.com/world/australia-charge-man-informing-russia-ukraine-military-activity-foreign-intelligence-6332806\"},{\"date\":\"2026-08-21\",\"event\":\"Russia's FSB says nine people have been arrested for planned attacks and espionage on behalf of Ukraine, according to Russian state agencies. Kyiv has not commented and the claims are not independently verified.\",\"source\":\"The Straits Times (Russian state agencies)\",\"url\":\"https://www.straitstimes.com/world/europe/russia-arrests-nine-for-planned-attacks-espionage-on-behalf-of-ukraine-state-agencies-report\"},{\"date\":\"2026-08-21\",\"event\":\"A Ukrainian man wanted over the 2022 Nord Stream pipeline sabotage is detained in Croatia, the second arrest in the German-led investigation.\",\"source\":\"The Straits Times, BBC\",\"url\":\"https://www.straitstimes.com/world/europe/ukrainian-nord-stream-blast-suspect-detained-in-croatia\"},{\"date\":\"2026-08-21\",\"event\":\"Mykhailo Fedorov, removed as defence minister, plans a trip to the United States to raise funding for his projects, The Straits Times reports - a sign his domestic challenge to Zelensky has shifted abroad after the wartime-election protests ended.\",\"source\":\"The Straits Times\",\"url\":\"https://www.straitstimes.com/world/europe/ukraines-ousted-defence-minister-plans-us-trip-to-raise-project-funding\"},{\"date\":\"2026-08-21\",\"event\":\"The BBC's Steve Rosenberg reports petrol shortages spreading in Russia as the cumulative effect of Ukrainian strikes on refineries and export infrastructure reaches ordinary consumers, though he finds little erosion of public support for the war.\",\"source\":\"BBC\",\"url\":\"https://www.bbc.co.uk/news/articles/c4gknzgje7go\"},{\"date\":\"2026-08-21\",\"event\":\"Japan lodges a formal protest over Russia's missile test near the disputed Kuril Islands, held days ahead of an expected Putin visit.\",\"source\":\"CNA, The Straits Times\",\"url\":\"https://www.channelnewsasia.com/east-asia/japan-protests-russia-missile-tests-disputed-islands-putin-visit-6333311\"},{\"date\":\"2026-08-21\",\"event\":\"Russian drones strike a shopping centre in Kryvyi Rih, Zelensky's home city, with a second drone hitting about half an hour after the first. Regional governor Oleksandr Hanzha says at least 16 people were killed and more than 130 wounded, 22 of them children, with 29 in serious condition and nine preliminarily missing; the toll rose through the day from 14. Zelensky calls it 'absolutely cynical and despicable' and a deliberate attempt to hit emergency services.\",\"source\":\"The Straits Times, BBC, CNA\",\"url\":\"https://www.straitstimes.com/world/europe/five-killed-52-wounded-in-russian-strike-on-ukraines-kryvyi-rih\"},{\"date\":\"2026-08-21\",\"event\":\"A separate Russian drone strike in the southern Mykolaiv region kills at least four people, three of them children, and wounds a woman, Ukrainian state media report.\",\"source\":\"The Straits Times (Ukrainian state media)\",\"url\":\"https://www.straitstimes.com/world/europe/five-killed-52-wounded-in-russian-strike-on-ukraines-kryvyi-rih\"},{\"date\":\"2026-08-21\",\"event\":\"The leaders of France, Britain and Germany announce they will co-chair a meeting on Ukraine on Monday.\",\"source\":\"The Straits Times\",\"url\":\"https://www.straitstimes.com/world/europe/french-british-german-leaders-to-co-chair-meeting-on-ukraine-on-monday\"},{\"date\":\"2026-08-21\",\"event\":\"Russian state agencies report that nine people have been arrested on suspicion of planning attacks and conducting espionage on Ukraine's behalf. The claim comes from Russian authorities and has not been independently verified.\",\"source\":\"The Straits Times (Russian state agencies)\",\"url\":\"https://www.straitstimes.com/world/europe/russia-arrests-nine-for-planned-attacks-espionage-on-behalf-of-ukraine-state-agencies-report\"},{\"date\":\"2026-08-21\",\"event\":\"Russia designates the independent news outlet Mediazona a 'foreign agent'.\",\"source\":\"The Straits Times\",\"url\":\"https://www.straitstimes.com/world/europe/russia-designates-independent-mediazona-news-outlet-as-foreign-agent\"},{\"date\":\"2026-08-22\",\"event\":\"German authorities are investigating possible Russian links to a weapons cache discovered in woodland, according to reports cited by the BBC. The investigation is unconfirmed by German officials on the record.\",\"source\":\"BBC\",\"url\":\"https://www.bbc.co.uk
